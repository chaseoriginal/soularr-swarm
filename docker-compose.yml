services:
  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    volumes:
    - soularr-swarm_data:/data
    - /media/Multimedia/Incoming/complete/lidarr:/downloads
    environment:
    - TZ=America/Chicago
    networks:
    - media
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.soularr == true
      restart_policy:
        condition: any
networks:
  media:
    external: true
volumes:
  soularr-swarm_data:
    name: soularr-swarm_data
