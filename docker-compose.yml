version: "3.8"

services:
  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    volumes:
      - data:/data
      - /media/Multimedia/Incoming/complete/lidarr:/downloads
    environment:
      - TZ=America/Chicago
    networks:
      - media
    deploy:
      placement:
        constraints:
          - node.labels.deployment.target.soularr == true
      restart_policy:
        condition: any
networks:
  media:
    external: true
volumes:
  data: